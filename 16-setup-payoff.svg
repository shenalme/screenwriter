<path d="M110 60 C 200 100 260 118 300 122" fill="none" stroke="#7B7A73" stroke-dasharray="3 3"/>
<path d="M340 70 C 420 108 480 124 540 128" fill="none" stroke="#7B7A73" stroke-dasharray="3 3"/>
