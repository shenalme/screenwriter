<g font-family="'Courier Prime','Courier New',monospace" font-size="11" fill="#1B1B1B">
<text x="212" y="46">INT. LAUNDROMAT - NIGHT</text>
<text x="212" y="78">Rows of dryers turning. MAYA, 30s,</text>
<text x="212" y="92">watches one of them like it owes her</text>
<text x="212" y="106">money.</text>
<text x="330" y="138">MAYA</text>
<text x="290" y="152">(to the dryer)</text>
<text x="266" y="166">Any time now.</text>
<text x="212" y="198">The dryer stops. Silence. Maya does</text>
<text x="212" y="212">not move.</text>
<text x="410" y="244">CUT TO:</text>
<text x="212" y="276">ANGLE ON the coin tray. A single coin</text>
<text x="212" y="290">sits in it, face up.</text>
</g>
<g font-family="Archivo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#7B7A73">
