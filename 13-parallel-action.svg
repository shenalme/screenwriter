<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two parallel tracks of action converging" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g font-family="Archivo,Helvetica,Arial,sans-serif" font-size="12" fill="#1B1B1B"><text x="20" y="56">SARAH</text><text x="20" y="156">JOHN</text></g>
<line x1="90" y1="50" x2="640" y2="50" stroke="#1B1B1B"/>
<line x1="90" y1="150" x2="640" y2="150" stroke="#1B1B1B"/>
<g fill="#C9AE3F" stroke="#1B1B1B"><circle cx="140" cy="50" r="6"/><circle cx="270" cy="50" r="6"/><circle cx="400" cy="50" r="6"/><circle cx="530" cy="50" r="6"/></g>
<g fill="#BCD3E6" stroke="#1B1B1B"><circle cx="205" cy="150" r="6"/><circle cx="335" cy="150" r="6"/><circle cx="465" cy="150" r="6"/><circle cx="595" cy="150" r="6"/></g>
<path d="M140 50 L205 150 L270 50 L335 150 L400 50 L465 150 L530 50 L595 150" fill="none" stroke="#D7D3C8" stroke-dasharray="4 4"/>
<g font-family="Archivo,Helvetica,Arial,sans-serif" font-size="10" fill="#7B7A73">
<text x="140" y="36" text-anchor="middle">phone rings</text><text x="270" y="36" text-anchor="middle">answers</text><text x="400" y="36" text-anchor="middle">hears the news</text><text x="530" y="36" text-anchor="middle">runs outside</text>
<text x="205" y="172" text-anchor="middle">driving</text><text x="335" y="172" text-anchor="middle">traffic stops</text><text x="465" y="172" text-anchor="middle">checks phone</text><text x="595" y="172" text-anchor="middle">turns around</text>
</g>
<text x="360" y="206" font-family="Archivo,Helvetica,Arial,sans-serif" font-size="11" fill="#7B7A73" text-anchor="middle">The dotted line is the audience, doing the work: measuring the gap between what she knows and what he knows.</text>
</svg>