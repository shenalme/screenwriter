<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenplay Technician — a technical course in writing for the screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bay:#1B1D22; --bay2:#242830; --bay3:#333941; --bayline:#3B424C;
  --paper:#FAF9F6; --paper2:#F1EFE8;
  --ink:#1B1B1B; --ink2:#4E4E4A; --ink3:#7B7A73;
  --rule:#D7D3C8; --rule2:#E7E3DA;
  --ok:#376E3E; --okbg:#DCEBD9;
  --no:#9E3535; --nobg:#F4DBDB;
  --hold:#7A6320; --holdbg:#F6ECC9;
  --mono:"Courier Prime","Courier New",Courier,monospace;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --stock:#FAF9F6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bay); color:var(--paper);
  font-family:var(--ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:#F5E7A8;color:#1B1B1B}
a{color:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid #F5E7A8;outline-offset:2px}

/* ---------- shell ---------- */
.bay{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.binder{
  background:var(--bay2);border-right:1px solid var(--bayline);
  position:sticky;top:0;height:100vh;overflow:auto;padding:22px 0 40px;
}
.binder-head{padding:0 20px 18px;border-bottom:1px solid var(--bayline);margin-bottom:10px}
.binder-head b{display:block;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15}
.binder-head span{display:block;color:#8C93A0;font-size:13px;margin-top:4px}
.tab{
  display:grid;grid-template-columns:12px 26px 1fr;gap:9px;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;color:#C7CCD6;
  padding:8px 16px 8px 12px;font-size:13.5px;line-height:1.3;border-left:3px solid transparent;
}
.tab:hover{background:#2C313A;color:#fff}
.tab .swatch{width:12px;height:12px;border-radius:2px;background:var(--s);align-self:center;box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.tab .num{color:#767E8C;font-family:var(--mono);font-size:12px}
.tab[aria-current="true"]{background:#2F343D;color:#fff;border-left-color:var(--s)}
.tab.done .num::after{content:"✓";margin-left:3px;color:#8FBE8C}
.binder .group{color:#767E8C;font-size:11.5px;padding:16px 16px 5px;letter-spacing:.04em}

.stage{min-width:0;display:flex;flex-direction:column}
.stagebar{
  display:flex;align-items:center;gap:16px;padding:14px 30px;
  border-bottom:1px solid var(--bayline);background:rgba(27,29,34,.94);
  position:sticky;top:0;z-index:6;backdrop-filter:blur(6px);
}
.menu-btn{display:none;background:#333941;border:1px solid var(--bayline);color:#fff;border-radius:6px;padding:6px 10px}
.ruler{flex:1;height:8px;background:#2E333B;border-radius:1px;overflow:hidden;position:relative}
.ruler i{display:block;height:100%;background:#B8CCE0;width:0;transition:width .3s}
.stagebar .count{font-family:var(--mono);font-size:12.5px;color:#98A0AD;white-space:nowrap}

.scroll{padding:34px 30px 90px;display:flex;justify-content:center}
.paper{
  background:var(--paper);color:var(--ink);width:100%;max-width:860px;
  padding:52px 56px 64px 78px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.06), 0 18px 50px rgba(0,0,0,.45);
}
.paper::before{
  content:"";position:absolute;left:30px;top:20%;height:60%;width:11px;
  background-image:radial-gradient(circle at 50% 0,var(--bay) 5.5px,transparent 6px),radial-gradient(circle at 50% 100%,var(--bay) 5.5px,transparent 6px);
  background-repeat:no-repeat;background-size:100% 50%;background-position:top,bottom;
}
.paper::after{content:"";position:absolute;inset:0 0 0 0;border-top:6px solid var(--stock);pointer-events:none}

/* ---------- page typography ---------- */
.stockchip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.stockchip i{width:26px;height:14px;background:var(--stock);border:1px solid rgba(0,0,0,.18);border-radius:2px;display:inline-block}
h1.mod{font-size:38px;line-height:1.05;letter-spacing:-.028em;font-weight:800;margin:0 0 10px}
.goal{font-size:18px;line-height:1.45;color:var(--ink2);margin:0 0 28px;max-width:60ch}
h2.sec{font-size:15px;font-weight:600;letter-spacing:.01em;margin:38px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2.sec em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:400}
p.body{font-size:15.5px;line-height:1.62;color:#2C2C29;max-width:68ch;margin:0 0 14px}
.note{font-size:14px;line-height:1.6;color:var(--ink2);border-left:2px solid var(--rule);padding:2px 0 2px 14px;margin:18px 0;max-width:66ch}
ul.plain{margin:0 0 16px;padding-left:20px;max-width:66ch;font-size:15px;line-height:1.6;color:#2C2C29}
ul.plain li{margin:5px 0}
.prompt{font-size:15.5px;font-weight:600;margin:0 0 12px}
.hint{font-size:13.5px;color:var(--ink3);margin:0 0 14px}

/* ---------- screenplay page ---------- */
.script{font-family:var(--mono);font-size:14px;line-height:1.5;background:#fff;border:1px solid var(--rule);padding:26px 30px;margin:0 0 18px;white-space:pre-wrap}
.script .sl{text-transform:uppercase}
.el{display:block;padding:1px 4px;margin:0 -4px;border-radius:2px}
.el.slug{text-transform:uppercase}
.el.chr{margin-left:34%;text-transform:uppercase}
.el.par{margin-left:26%}
.el.dlg{margin-left:18%;max-width:60%}
.el.trn{text-align:right;text-transform:uppercase}
.el.blank{height:.9em}
button.el{width:calc(100% + 8px);text-align:left;border:0;background:none;font-family:var(--mono);font-size:14px;line-height:1.5;color:inherit;display:block}
button.el.chr,button.el.dlg,button.el.par{width:auto}
button.el:hover{background:#F1EFE8}
button.el.sel{background:#F5E7A8;box-shadow:inset 0 0 0 1px #C9AE3F}
button.el.hit{background:var(--okbg);box-shadow:inset 0 0 0 1px #7FA97C}
button.el.miss{background:var(--nobg);box-shadow:inset 0 0 0 1px #C08A8A}
button.el.cut{background:#EDEBE4;color:#A9A79E;text-decoration:line-through}

/* ---------- controls ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{
  background:#fff;border:1px solid var(--rule);border-radius:3px;padding:7px 12px;
  font-size:14px;color:var(--ink);font-family:var(--mono);
}
.chip:hover{border-color:#9C978A;background:#FFFDF5}
.chip.on{background:#F5E7A8;border-color:#C9AE3F}
.chip.ok{background:var(--okbg);border-color:#7FA97C}
.chip.no{background:var(--nobg);border-color:#C08A8A}
.chip.ui{font-family:var(--ui)}
.chip[disabled]{opacity:.45;cursor:default}
.btn{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:3px;
  padding:9px 16px;font-size:14px;font-weight:500;
}
.btn:hover{background:#000}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:#F1EFE8}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 0}
.verdict{margin:16px 0 0;padding:13px 16px;border-radius:3px;font-size:14.5px;line-height:1.55;max-width:66ch}
.verdict.ok{background:var(--okbg);color:#254D2A}
.verdict.no{background:var(--nobg);color:#6E2626}
.verdict.info{background:#EAEEF3;color:#26353F}
.verdict b{font-weight:700}

/* ---------- panels / buckets ---------- */
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin:14px 0 0}
.bucket{border:1px dashed var(--rule);border-radius:3px;padding:10px;min-height:96px;background:#fff;text-align:left}
.bucket h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.bucket .drop{display:block;width:100%;font-size:13px;color:var(--ink3);border:0;background:none;padding:6px;text-align:left}
.bucket.armed{border-color:#C9AE3F;background:#FFFCF0}
.placed{display:block;font-family:var(--mono);font-size:12.5px;background:#F4F2EB;border-radius:2px;padding:5px 7px;margin:0 0 5px;line-height:1.35}
.placed.ok{background:var(--okbg)}
.placed.no{background:var(--nobg)}

.list{border:1px solid var(--rule);background:#fff}
.list .item{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border-bottom:1px solid var(--rule2);padding:9px 12px;font-size:14px}
.list .item:last-child{border-bottom:0}
.list .item .mv{background:none;border:1px solid var(--rule);border-radius:3px;width:26px;height:26px;line-height:1;color:var(--ink2)}
.list .item.ok{background:var(--okbg)}
.list .item.no{background:var(--nobg)}
.list .item .tag{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-right:6px}

table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 16px}
table.cmp th,table.cmp td{border:1px solid var(--rule);padding:9px 11px;text-align:left;vertical-align:top}
table.cmp th{background:var(--paper2);font-weight:600;font-size:13px}
table.cmp td.m{font-family:var(--mono);font-size:13px}

textarea.write{
  width:100%;min-height:96px;font-family:var(--mono);font-size:14px;line-height:1.5;
  border:1px solid var(--rule);background:#fff;padding:12px;color:var(--ink);resize:vertical;
}
input.num{width:74px;font-family:var(--mono);font-size:14px;padding:7px 8px;border:1px solid var(--rule);background:#fff}
label.q{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}

/* ---------- svg figure ---------- */
figure.fig{margin:18px 0 22px;border:1px solid var(--rule);background:#fff;padding:16px}
figure.fig svg{display:block;width:100%;height:auto}
figure.fig figcaption{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.45}

/* ---------- pager ---------- */
.pager{display:flex;justify-content:space-between;gap:14px;max-width:860px;margin:26px auto 0;width:100%}
.pager button{background:#2A2F37;border:1px solid var(--bayline);color:#D6DAE1;border-radius:4px;padding:11px 15px;font-size:14px;text-align:left;max-width:47%}
.pager button:hover{background:#343A44;color:#fff}
.pager button span{display:block;font-size:11.5px;color:#8C93A0}
.pager button[disabled]{opacity:.35;cursor:default}

/* ---------- title page (home) ---------- */
.titlepage{font-family:var(--mono);text-align:center;padding:56px 0 30px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.titlepage h1{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.06em;margin:0 0 22px;text-transform:uppercase}
.titlepage .by{font-size:15px;margin:0 0 44px;color:var(--ink2)}
.titlepage .fade{font-size:15px;color:var(--ink2);letter-spacing:.08em}
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;margin:18px 0 0}
.card{background:#fff;border:1px solid var(--rule);border-top:5px solid var(--s);padding:13px 14px;text-align:left}
.card:hover{background:#FFFDF5;border-color:#9C978A}
.card b{display:block;font-size:14.5px;font-weight:600;line-height:1.25;margin-bottom:5px}
.card span{display:block;font-size:12.5px;color:var(--ink3);line-height:1.4}
.card .n{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}

/* ---------- room (module 10) ---------- */
.room{position:relative;background:#fff;border:1px solid var(--rule);height:300px;margin:14px 0}
.room .lbl{position:absolute;font-family:var(--mono);font-size:11.5px;color:var(--ink3);transform:translate(-50%,-50%)}
.room .obj{position:absolute;border:1px solid var(--ink3);background:var(--paper2);font-family:var(--mono);font-size:11px;color:var(--ink2);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.room .fig-c{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);background:#F5E7A8;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);cursor:grab;touch-action:none}
.room .fig-c.j{background:#B8CCE0}
.room .fig-c.armed{box-shadow:0 0 0 3px rgba(201,174,63,.55)}

/* ---------- knowledge tracker (module 17) ---------- */
.track{display:grid;grid-template-columns:150px repeat(4,1fr);border:1px solid var(--rule);background:#fff;font-size:13px}
.track>div{border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);padding:9px 10px}
.track .hd{background:var(--paper2);font-weight:600;font-size:12px}
.track .rw{font-size:12.5px;color:var(--ink2)}
.track button.k{width:100%;border:1px solid var(--rule);background:#fff;border-radius:3px;padding:6px;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.track button.k.on{background:#F5E7A8;border-color:#C9AE3F;color:var(--ink)}

.timerbar{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:14px;margin:0 0 14px}
.timerbar .clock{font-size:22px;font-weight:700}
.score{font-family:var(--mono);font-size:15px;background:var(--paper2);border:1px solid var(--rule);padding:12px 14px;margin:14px 0 0}

.pipe{border:1px solid var(--rule);background:#fff;padding:0;margin:16px 0}
.pipe .st{border-bottom:1px solid var(--rule2);padding:14px 16px}
.pipe .st:last-child{border-bottom:0}
.pipe .st h4{margin:0 0 3px;font-size:14px;font-weight:600}
.pipe .st p{margin:0 0 9px;font-size:13px;color:var(--ink3);line-height:1.5}
.pipe .st.locked{opacity:.5}

@media (max-width:900px){
  .bay{grid-template-columns:1fr}
  .binder{position:fixed;z-index:20;width:280px;left:0;top:0;transform:translateX(-100%);transition:transform .22s}
  .binder.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .menu-btn{display:block}
  .scroll{padding:20px 14px 70px}
  .paper{padding:34px 22px 46px}
  .paper::before{display:none}
  h1.mod{font-size:29px}
  .el.chr{margin-left:26%}.el.dlg{margin-left:12%;max-width:78%}.el.par{margin-left:20%}
  .track{grid-template-columns:110px repeat(4,1fr);font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bay">
  <aside class="binder" id="binder">
    <div class="binder-head">
      <b>Screenplay Technician</b>
      <span>The craft of the page, in 20 modules</span>
    </div>
    <nav id="tabs" aria-label="Modules"></nav>
  </aside>
  <main class="stage">
    <div class="stagebar">
      <button class="menu-btn" id="menuBtn" aria-label="Show module list">Modules</button>
      <div class="ruler" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="ruler"><i id="rulerFill"></i></div>
      <div class="count" id="count">0/20 modules cleared</div>
    </div>
    <div class="scroll">
      <div style="width:100%;max-width:860px">
        <article class="paper" id="page" tabindex="-1"></article>
        <nav class="pager" id="pager"></nav>
      </div>
    </div>
  </main>
</div>
<script>
/* ============================================================
   Screenplay Technician — course data
   Revision-stock colours are the real Hollywood order:
   White, Blue, Pink, Yellow, Green, Goldenrod, Salmon, Cherry,
   Buff, Tan, then the cycle repeats as "second" colours.
   ============================================================ */
const STOCK = [
  ["White","#FAF9F6"],["Blue","#BCD3E6"],["Pink","#F3C9D6"],["Yellow","#F5E7A8"],
  ["Green","#C3DCBE"],["Goldenrod","#E9C97E"],["Salmon","#F3BFA9"],["Cherry","#E29A9A"],
  ["Buff","#EBDCC0"],["Tan","#D9C39C"],
  ["Second White","#F7F5EF"],["Second Blue","#A9C4DC"],["Second Pink","#EDB7C8"],["Second Yellow","#EFDD8E"],
  ["Second Green","#B2D0AC"],["Second Goldenrod","#DFBB66"],["Second Salmon","#EBAE94"],["Second Cherry","#D78585"],
  ["Second Buff","#E2CFAB"],["Second Tan","#CBB183"]
];

const MODULES = [
/* ---------------------------------------------------------- 1 */
{
 title:"The screenplay as a technical document",
 short:"Anatomy of the page",
 goal:"A screenplay is not a story written down. It is a set of instructions for people who will spend money turning it into pictures and sound. Learn what each part of the page is for.",
 body:[
  {t:"p",x:"Every mark on a screenplay page belongs to one of seven elements. Each element has a job, a position on the page, and a department that reads it. A producer scans scene headings to budget locations. A first assistant director breaks down action for the shooting schedule. An actor reads dialogue and, reluctantly, parentheticals. Nothing on the page is decorative."},
  {t:"fig",svg:"anatomy",cap:"The seven elements and their fixed positions on a US Letter page in 12-point Courier. The margins are not aesthetic: they are what makes one page run roughly one minute."},
  {t:"h",x:"Screenplay anatomy",m:"click any line"},
  {t:"act",a:{kind:"hotspot",prompt:"Click each line of this page. Every element will tell you what it is doing and who reads it.",
    lines:[
      {c:"slug",t:"INT. LAUNDROMAT - NIGHT",el:"Scene heading (slug line)",why:"Declares interior or exterior, location, and time of day. Production reads this line to schedule, budget and break down the script. It is the only element that creates a new scene."},
      {c:"act",t:"Rows of dryers turning. MAYA, 30s, watches one of them like it owes her money.",el:"Action",why:"Present-tense description of what a camera and microphone can record. A character's name is capitalised on first appearance only."},
      {c:"chr",t:"MAYA",el:"Character cue",why:"Names the speaker. Always capitalised, always directly above the dialogue. Continuity, sound and casting departments count these to work out who is in the scene."},
      {c:"par",t:"(to the dryer)",el:"Parenthetical",why:"A short delivery or direction note. Use it only when the line would otherwise be misread. It is not a place to direct the actor's performance."},
      {c:"dlg",t:"Any time now.",el:"Dialogue",why:"What is said aloud. Everything else on the page is subordinate to whether this can be spoken by a person."},
      {c:"act",t:"The dryer stops. Silence. Maya does not move.",el:"Action",why:"Beats of silence are written as action. Sound is filmable: the absence of the machine is a recordable event."},
      {c:"trn",t:"CUT TO:",el:"Transition",why:"An editing instruction. Modern spec scripts mostly leave the cut implicit — the next scene heading already means we have cut."},
      {c:"act",t:"ANGLE ON the coin tray.",el:"Shot / camera direction",why:"Tells the camera what to do. Writers use these sparingly; specifying shots is the director's job and it slows the read."}
    ]}},
  {t:"h",x:"Identify the element",m:"7 lines"},
  {t:"act",a:{kind:"pick",prompt:"For each line, choose the element it is.",
    options:["Scene heading","Action","Character cue","Dialogue","Parenthetical","Transition","Shot"],
    items:[
      {t:"EXT. CAR PARK - DAWN",c:"slug",a:0,why:"Interior/exterior, location, time. That is a scene heading."},
      {t:"(under his breath)",c:"par",a:4,why:"A bracketed delivery note tucked between the cue and the line."},
      {t:"DISSOLVE TO:",c:"trn",a:5,why:"Right-aligned editing instruction: a transition."},
      {t:"He drops the keys into the drain.",c:"act",a:1,why:"Present tense, filmable, unindented: action."},
      {t:"CLOSE ON the keys, sinking.",c:"act",a:6,why:"It reads like action, but it is instructing the camera. That is a shot."},
      {t:"DETECTIVE ONWU",c:"chr",a:2,why:"Capitalised name sitting alone above a line: a character cue."},
      {t:"I never said I was sorry.",c:"dlg",a:3,why:"Indented spoken text under a cue: dialogue."}
    ]}},
  {t:"h",x:"What formatting is actually for",m:""},
  {t:"table",head:["Element","Read by","If it is wrong"],rows:[
    ["Scene heading","Producer, 1st AD, location manager","The schedule and budget are wrong"],
    ["Action","Director, all departments","Someone builds, buys or lights the wrong thing"],
    ["Character cue","Casting, sound, continuity","A part goes uncounted or uncast"],
    ["Dialogue","Actors, editor","The take runs long or unplayable"],
    ["Parenthetical","Actors","The performance is pre-chewed and the actor resents it"],
    ["Transition","Editor","Nothing, usually — which is why they are mostly cut"]
  ]},
  {t:"note",x:"A useful test for the whole course: if a line on the page does not change what someone would do on set or in the cutting room, ask why it is there."}
 ]
},
/* ---------------------------------------------------------- 2 */
{
 title:"Scene headings and slug lines",
 short:"INT./EXT., location, time",
 goal:"Master the one line that controls scheduling, budget and the reader's sense of place. Then learn the harder question: when is this a new scene at all?",
 body:[
  {t:"p",x:"A scene heading has three compulsory parts in a fixed order: whether the camera is inside or outside, where we are, and when. Everything else — CONTINUOUS, LATER, MOMENTS LATER, specific clock times — is an optional fourth part that exists to answer a question the reader would otherwise have to guess at."},
  {t:"fig",svg:"slug",cap:"The anatomy of a slug line. The separator is an en or em dash with spaces; a hyphen is tolerated. Consistency across the whole script matters more than which one you pick."},
  {t:"h",x:"Slug line builder",m:"assemble the line"},
  {t:"act",a:{kind:"build",prompt:"Build a heading for a scene shot inside a hotel room, at night.",
    chips:["INT.","EXT.","INT./EXT.","HOTEL ROOM","HOTEL","NIGHT","DAY","- ","CONTINUOUS"],
    answer:"INT. HOTEL ROOM - NIGHT",
    why:"Interior, then the location as production would label it, then time of day. Note there is no scene number and no camera information."}},
  {t:"act",a:{kind:"build",prompt:"Now a harder one. A character drives; we shoot both the interior of the car and the road outside, in the small hours before sunrise.",
    chips:["INT./EXT.","INT.","MOVING CAR","MOTORWAY","DAWN","PRE-DAWN","NIGHT","- ","LATER"],
    answer:"INT./EXT. MOVING CAR - PRE-DAWN",
    alt:["INT./EXT. MOVING CAR - DAWN"],
    why:"INT./EXT. tells the AD this is a process or car-rig day, which is a completely different schedule and budget from a stage interior. PRE-DAWN is a real production time: a short, expensive window."}},
  {t:"h",x:"Time and continuity qualifiers",m:""},
  {t:"table",head:["Qualifier","Means","Use when"],rows:[
    ["CONTINUOUS","Time runs unbroken from the previous scene","A character walks from one space directly into another"],
    ["LATER","Same location, unspecified time has passed","You want the gap felt but not measured"],
    ["MOMENTS LATER","A very short gap","The audience must not think we have jumped ahead"],
    ["SAME","Simultaneous with the previous scene","Cutting between two places at once"],
    ["DAY / NIGHT","The only two the schedule really needs","Always, unless there is a reason"],
    ["DAWN / DUSK","A narrow, costly shooting window","The light itself is doing dramatic work"]
  ]},
  {t:"h",x:"Is this a new scene?",m:"3 judgements"},
  {t:"act",a:{kind:"quiz",prompt:"Read each pair and decide.",
    qs:[
     {q:"INT. RESTAURANT - NIGHT / “Sarah enters the kitchen.” Then: INT. RESTAURANT KITCHEN - NIGHT",
      a:["New scene — new heading is correct","Continuation — delete the second heading","Either is fine, it is a style choice"],c:0,
      why:"The kitchen is a different set, lit and dressed separately, possibly shot on a different day. Production needs its own slug. Add CONTINUOUS if she walks straight in."},
     {q:"INT. FLAT - NIGHT. Sarah argues with John for four pages, then they stop and stare at each other for a long silence.",
      a:["New scene — the silence is a new beat","Continuation — same set, same time, one scene","New scene — four pages is too long"],c:1,
      why:"A new dramatic beat is not a new scene. Scenes are defined by unbroken location and time, not by changes in the emotional weather."},
     {q:"EXT. STREET - NIGHT, then we move to a doorway three metres away in the same shot.",
      a:["New heading: EXT. DOORWAY - NIGHT","No new heading — it is the same location","New heading with CONTINUOUS"],c:1,
      why:"If it is inside the same shot and the same set-up, a heading would fragment the scene for no production benefit. Write it as action."}
    ]}},
  {t:"h",x:"Timeline exercise",m:"5 headings"},
  {t:"act",a:{kind:"order",prompt:"A character wakes, leaves, drives, arrives and hides. Put the headings in the order that tells that story cleanly.",
    items:[
     {t:"INT. APARTMENT - DAWN"},
     {t:"EXT. STREET - CONTINUOUS"},
     {t:"INT. CAR - MOVING - DAY"},
     {t:"INT. RESTAURANT - DAY"},
     {t:"INT. RESTAURANT BATHROOM - CONTINUOUS"}
    ],
    why:"Five headings, five production units. Notice how CONTINUOUS carries the character through a door without a time jump, and how the day rolls over from DAWN to DAY across the drive."}},
  {t:"note",x:"Count your headings before you count your pages. Forty locations in a ninety-page script is a different film from six locations in a ninety-page script, whatever the story is about."}
 ]
},
/* ---------------------------------------------------------- 3 */
{
 title:"Action lines",
 short:"What the camera can see",
 goal:"Action is limited to what a camera can record and a microphone can hear. Learn where that line falls, and how to compress what survives it.",
 body:[
  {t:"p",x:"The constraint is simple and total: if it cannot be photographed or heard, it cannot be action. Interiority is the novelist's home ground and the screenwriter's trap. This does not mean feelings are banned from screenplays — it means they must arrive through behaviour."},
  {t:"h",x:"Can the camera see this?",m:"6 statements"},
  {t:"act",a:{kind:"sort",prompt:"Sort each statement by how filmable it is.",
    buckets:[{id:"v",label:"Visible"},{id:"a",label:"Audible"},{id:"p",label:"Filmable with work"},{id:"n",label:"Not filmable"}],
    items:[
     {t:"John clenches his fist.",b:"v",why:"A physical action. The camera has something to point at."},
     {t:"John feels betrayed.",b:"n",why:"A state with no image. It belongs in your notes, not the page."},
     {t:"John remembers his father.",b:"n",why:"Memory has no exterior. You would have to invent a behaviour or a device — an object, a photograph, a cut."},
     {t:"John sees his father standing across the street.",b:"p",why:"Filmable, but only through construction: John looks, we cut to the father, we cut back. The word “sees” is doing editing work."},
     {t:"A door slams somewhere below.",b:"a",why:"Off-screen sound is a legitimate and cheap piece of storytelling."},
     {t:"John's hand shakes as he lights the cigarette.",b:"v",why:"The emotion is fully present, but arrives as behaviour. This is the whole craft in one line."}
    ]}},
  {t:"h",x:"Rewrite the unfilmable",m:""},
  {t:"act",a:{kind:"write",prompt:"Rewrite “John feels betrayed” as filmable action. One or two lines.",
    hint:"Give him something to do with his body, his hands, or an object. Do not name the emotion.",
    model:"John reads the message twice. He puts the phone face down on the table, very carefully, as if it might go off."}},
  {t:"h",x:"Compression",m:"6 lines to 1"},
  {t:"p",x:"Read this, then reveal the three passes. Each pass throws away something, and each pass is faster on screen."},
  {t:"script",lines:[{c:"act",t:"John walks slowly across the room. He is extremely nervous and doesn't really know what to do. Eventually he reaches the window and looks outside."}]},
  {t:"act",a:{kind:"reveal",prompt:"Three compressions of the same moment.",
    steps:[
     {h:"Pass one — cut the unfilmable",b:"John crosses the room slowly. At the window, he looks out.",n:"“Extremely nervous” and “doesn't really know what to do” are removed. Nothing visible was lost."},
     {h:"Pass two — cut the sequencing",b:"John crosses to the window and looks out.",n:"“Slowly” and “eventually” were asking the actor and editor to make the same decision twice."},
     {h:"Pass three — cut to the image",b:"John at the window.",n:"Three words. The crossing is implied by the cut. On screen the difference between pass one and pass three can be four seconds, and four seconds is worth having."}
    ]}},
  {t:"h",x:"Prose length and screen time",m:""},
  {t:"table",head:["On the page","Roughly","Reads as"],rows:[
    ["1 line of action","2–4 seconds","A single image"],
    ["3–4 lines","8–15 seconds","A small piece of business"],
    ["5+ lines unbroken","Reader skims","A wall — break it into paragraphs"]
  ]},
  {t:"note",x:"Paragraph breaks in action are a rhythm instruction. One paragraph tends to read as one shot or one unbroken beat. Writers use white space to control the speed of the read, which is the closest thing a script has to a cut."}
 ]
},
/* ---------------------------------------------------------- 4 */
{
 title:"Screen time and page count",
 short:"The page-per-minute rule",
 goal:"Understand why a page is a minute, where the conventional structural landmarks fall, and how to estimate a scene's running time from the page.",
 body:[
  {t:"p",x:"One formatted page runs roughly one minute of screen time. This is not a mystical law; it is an artefact of 12-point Courier at fixed margins, averaged over thousands of scripts. Dialogue-heavy pages run short. Action-heavy pages run long, sometimes catastrophically so. The rule is a planning instrument, not a guarantee."},
  {t:"h",x:"The page timeline",m:"place 6 landmarks"},
  {t:"act",a:{kind:"place",prompt:"Drop each landmark where it conventionally falls in a 120-page feature. Click a card, then click the ruler.",
    max:120,tol:9,
    marks:[
     {label:"Opening image",page:1},
     {label:"Inciting incident",page:12},
     {label:"First turning point",page:28},
     {label:"Midpoint",page:60},
     {label:"Second turning point",page:85},
     {label:"Climax",page:110}
    ],
    why:"These are relationships, not commandments. What matters is the ratio: the disturbance arrives early, the middle is the longest stretch, and the last turn leaves only a short run to the end. Move any one of them and the others must move too."}},
  {t:"fig",svg:"landmarks",cap:"The conventional shape at 120 pages. At 100 pages every landmark slides proportionally inward; the story does not acquire a different structure, it acquires less room."},
  {t:"h",x:"How long is this scene?",m:"estimate"},
  {t:"script",lines:[
   {c:"slug",t:"INT. KITCHEN - NIGHT"},
   {c:"act",t:"Sarah enters."},
   {c:"chr",t:"JOHN"},{c:"dlg",t:"You're late."},
   {c:"chr",t:"SARAH"},{c:"dlg",t:"I know."},
   {c:"chr",t:"JOHN"},{c:"dlg",t:"Where were you?"},
   {c:"chr",t:"SARAH"},{c:"dlg",t:"At work."},
   {c:"act",t:"John looks at her."}
  ]},
  {t:"act",a:{kind:"estimate",prompt:"Estimate the screen time of the scene above, in seconds.",
    answer:25,tol:12,unit:"seconds",
    why:"About a quarter of a page, but it will not play in fifteen seconds. Four short exchanges plus an entrance and a held look runs around 25–35 seconds, because pauses cost time and short lines invite them. This is the standard trap: sparse dialogue pages play longer than they measure, dense action pages play shorter than they read."}},
  {t:"h",x:"Where the rule breaks",m:""},
  {t:"table",head:["Page type","Measured","Actually plays"],rows:[
    ["Rapid overlapping dialogue","1 min","35–45 sec"],
    ["Two-hander with silences","1 min","1 min 30+"],
    ["“They fight.” (one line)","3 sec","4 minutes"],
    ["Montage of six shots","30 sec","45–90 sec"],
    ["Dense unbroken action block","1 min","2 min or a cut scene"]
  ]},
  {t:"note",x:"“They fight.” is the most expensive sentence in screenwriting. When one line of action buys minutes of screen time and a week of shooting, write enough to show what the sequence is about, and no more."}
 ]
},
/* ---------------------------------------------------------- 5 */
{
 title:"Scene structure",
 short:"Beats and their order",
 goal:"A scene is not a conversation that happens to end. It is a sequence of changes. Learn to see the beats and to feel when they are in the wrong order.",
 body:[
  {t:"p",x:"A beat is the smallest unit of change in a scene: a moment after which something is different. Somebody wants something, something is in the way, they try something, the situation shifts. When a scene feels flat, it is almost always because the beats are missing, repeated, or in an order that lets the pressure out early."},
  {t:"fig",svg:"beats",cap:"A functioning scene as a pressure curve. The reversal is the point after which the scene cannot go back to how it started — which is also the reason to end the scene shortly afterwards."},
  {t:"h",x:"Beat identification",m:"find 4 beats"},
  {t:"act",a:{kind:"trim",prompt:"Click the four lines where something changes. Everything else is texture.",
    mode:"mark",need:4,
    lines:[
     {c:"slug",t:"INT. GARAGE - NIGHT"},
     {c:"act",t:"MAYA is packing a bag. RAY watches from the doorway."},
     {c:"chr",t:"MAYA"},{c:"dlg",t:"Give me the keys.",k:1,why:"Goal. The scene now has something to want."},
     {c:"chr",t:"RAY"},{c:"dlg",t:"No.",k:1,why:"Resistance. Without it the scene is an errand."},
     {c:"chr",t:"MAYA"},{c:"dlg",t:"Then come with me."},
     {c:"chr",t:"RAY"},{c:"dlg",t:"You know I can't."},
     {c:"act",t:"She holds up his phone.",k:1,why:"Tactic. She stops asking and starts leveraging — a change of method is a beat."},
     {c:"chr",t:"MAYA"},{c:"dlg",t:"I read the messages."},
     {c:"act",t:"Ray puts the keys on the workbench and walks out.",k:1,why:"Reversal. He gives up the thing he refused, and leaves. The scene is over; anything after this is a lap of honour."}
    ],
    why:"Goal, resistance, tactic, reversal. Four beats in nine lines. The unmarked lines are not waste — they carry the beats — but nothing changes in them."}},
  {t:"h",x:"Rearrange the scene",m:"6 beats"},
  {t:"act",a:{kind:"order",prompt:"Six beats, out of order. Arrange them so the scene escalates.",
    items:[
     {t:"Goal — Detective asks the widow to identify the watch."},
     {t:"Resistance — She says she has never seen it before."},
     {t:"Tactic — He mentions the pawn shop receipt."},
     {t:"Reaction — She asks for a glass of water."},
     {t:"Escalation — He puts the receipt on the table, face up."},
     {t:"Reversal — She says: “It was my son's.”"}
    ],
    why:"Move the reversal anywhere but last and the scene deflates: once she has told the truth, the receipt has nothing left to do. Escalation only exists if the pressure arrives after the resistance."}},
  {t:"h",x:"Beat timeline",m:""},
  {t:"fig",svg:"beattime",cap:"The same scene laid against clock time. Beats are not evenly spaced: the reversal usually arrives late and fast, and the scene should end within seconds of it."}
 ]
}
];
MODULES.push(
/* ---------------------------------------------------------- 6 */
{
 title:"Scene purpose",
 short:"Why does this scene exist?",
 goal:"Every scene must do at least one job, and good scenes do several at once. Learn to diagnose a scene's function, and to test it by deletion.",
 body:[
  {t:"p",x:"There are only so many things a scene can be for. Naming the job is not academic: a scene that cannot be assigned one is the scene that gets cut in the edit, after you have paid for it."},
  {t:"h",x:"Diagnose the functions",m:"select all that apply"},
  {t:"script",lines:[
   {c:"slug",t:"INT. HOSPITAL CORRIDOR - DAY"},
   {c:"act",t:"NADIA, 40s, still in her coat, waits. DR. AKEN approaches with a folder."},
   {c:"chr",t:"AKEN"},{c:"dlg",t:"He's stable. He was asking for someone called Peter."},
   {c:"act",t:"Nadia doesn't react."},
   {c:"chr",t:"NADIA"},{c:"dlg",t:"There is no Peter."},
   {c:"act",t:"She takes the folder. Aken doesn't let go of it straight away."},
   {c:"chr",t:"AKEN"},{c:"dlg",t:"He'll need someone at home with him. For weeks."},
   {c:"act",t:"Nadia looks at the folder, not at him."}
  ]},
  {t:"act",a:{kind:"multi",prompt:"What is this scene doing? Choose every function it performs.",
    opts:[
     {t:"Introduces information",ok:1},
     {t:"Establishes character",ok:1},
     {t:"Creates conflict",ok:1},
     {t:"Sets up a future event",ok:1},
     {t:"Pays off a previous setup",ok:0},
     {t:"Changes the stakes",ok:1},
     {t:"Reverses a relationship",ok:0}
    ],
    why:"It plants a name (Peter), reveals that Nadia is lying or hiding something, applies pressure through Aken's grip on the folder, and sets up weeks of enforced proximity — a future the audience can now dread. It pays off nothing yet, and no relationship reverses. Four jobs in half a page is efficient work."}},
  {t:"h",x:"Delete the scene",m:"consequence test"},
  {t:"act",a:{kind:"quiz",prompt:"Now remove it from the script and see what breaks.",
    qs:[
     {q:"If this scene is deleted, what is the biggest structural consequence?",
      a:["Nothing — the information appears elsewhere","The audience never learns that Nadia is concealing something, so her later behaviour reads as arbitrary","The hospital location becomes unnecessary"],c:1,
      why:"Deletion is the sharpest diagnostic you have. If a scene can be lifted with no consequence, it was texture. If lifting it makes a later scene incomprehensible, it was load-bearing — and you have just found out which."},
     {q:"A scene contains only: two characters agree about something they already agreed about. What is the correct action?",
      a:["Give one of them a reason to disagree","Cut it, and move any necessary information into a scene that already has conflict","Lengthen it so the agreement means more"],c:1,
      why:"Both the first and second answers can work, but the second is the default professional move: information is portable, conflict is not. Carry the fact into a scene that is already working."}
    ]}},
  {t:"note",x:"A test worth applying to every scene in a draft: what is different at the end of this scene from the beginning? If the honest answer is “we know one more thing”, the scene is doing one job, and it had better be a job worth a minute of the film."}
 ]
},
/* ---------------------------------------------------------- 7 */
{
 title:"Dialogue mechanics",
 short:"Formatting, parentheticals, economy",
 goal:"Not how to write good lines in the abstract. How dialogue behaves as a technical object on the page: how it is set, when a parenthetical earns its place, and how far it can be cut.",
 body:[
  {t:"h",x:"Prose into dialogue",m:"build the block"},
  {t:"p",x:"Prose fiction attributes speech inline. A screenplay separates the speaker from the speech, because two different people on set read the two things."},
  {t:"script",lines:[{c:"act",t:"Sarah says, quietly, “I don't want to go.”"}]},
  {t:"act",a:{kind:"build",prompt:"Set that as screenplay dialogue. Add only what is needed.",
    chips:["SARAH","(quietly)","I don't want to go.","“I don't want to go.”","Sarah says","(sadly)"],
    answer:"SARAH (quietly) I don't want to go.",
    alt:["SARAH I don't want to go."],
    why:"Cue, optional parenthetical, line. Quotation marks disappear — the indentation is the quotation mark. Either answer is defensible: “quietly” survives only if the line would otherwise be read at full volume, and reasonable writers would cut it."}},
  {t:"h",x:"Parenthetical diagnosis",m:"5 cases"},
  {t:"act",a:{kind:"sort",prompt:"Sort each parenthetical by whether it earns its line.",
    buckets:[{id:"y",label:"Necessary"},{id:"n",label:"Unnecessary"},{id:"m",label:"Misuse"}],
    items:[
     {t:"(into phone)",b:"y",why:"Necessary. It tells us who is being addressed, which the line alone cannot."},
     {t:"(sarcastic)",b:"y",why:"Necessary when the words say the opposite of the meaning and nothing else signals it. This is the classic legitimate case."},
     {t:"(angrily) — after: “GET OUT OF MY HOUSE!”",b:"n",why:"Unnecessary. The line already carries it. You are directing an actor who has read the same line you did."},
     {t:"(he crosses to the window and pours a drink)",b:"m",why:"Misuse. Action inside a parenthetical. Anything longer than a few words belongs in an action line, where the crew can see it."},
     {t:"(beat)",b:"y",why:"Necessary in moderation — it is a timing instruction, the only rhythm notation a screenplay has. Used four times on a page it becomes wallpaper."}
    ]}},
  {t:"h",x:"Dialogue trimming",m:"20 lines to 5"},
  {t:"p",x:"Cut this exchange to twelve lines without losing the information. Then to eight. Then to five. Click a line to cut it; click again to restore it."},
  {t:"act",a:{kind:"trim",prompt:"Cut lines. The counter shows where you are.",
    mode:"cut",targets:[12,8,5],
    lines:[
     {c:"chr",t:"DAN",p:1},{c:"dlg",t:"Hey.",p:1},
     {c:"chr",t:"ROS",p:1},{c:"dlg",t:"Hey. You came.",p:1},
     {c:"chr",t:"DAN",p:1},{c:"dlg",t:"I said I would.",p:1},
     {c:"chr",t:"ROS",p:1},{c:"dlg",t:"You say a lot of things.",p:1},
     {c:"chr",t:"DAN",p:1},{c:"dlg",t:"Is she here?",p:1,key:1},
     {c:"chr",t:"ROS",p:1},{c:"dlg",t:"Who?",p:1},
     {c:"chr",t:"DAN",p:1},{c:"dlg",t:"You know who.",p:1},
     {c:"chr",t:"ROS",p:1},{c:"dlg",t:"She left an hour ago. She took the car.",p:1,key:1},
     {c:"chr",t:"DAN",p:1},{c:"dlg",t:"An hour.",p:1},
     {c:"chr",t:"ROS",p:1},{c:"dlg",t:"Maybe more. I wasn't watching the clock, Dan.",p:1}
    ],
    why:"The two lines carrying information are “Is she here?” and “She left an hour ago. She took the car.” Everything else is warm-up. At five lines the scene is colder and faster, and you have to decide whether that coldness is what the film wants — which is the real lesson. Economy is a tool, not a virtue."}},
  {t:"note",x:"Read every cut aloud. A line that survives on the page and dies in the mouth is the commonest fault in dialogue, and the page will never tell you about it."}
 ]
},
/* ---------------------------------------------------------- 8 */
{
 title:"Subtext and information",
 short:"What the line actually says",
 goal:"The words are the surface. Learn to control the gap between what is said and what is meant, in both directions.",
 body:[
  {t:"p",x:"Subtext is not a decoration applied to dialogue; it is a consequence of context. The same three words carry a different payload depending on what the audience knows, what the speaker wants, and what has just happened. Which means you write subtext by arranging the situation, not by writing clever lines."},
  {t:"h",x:"What does the line communicate?",m:"4 contexts"},
  {t:"p",x:"In every case the line is the same: “That's nice.”"},
  {t:"act",a:{kind:"sort",prompt:"Match each situation to what the line is actually doing.",
    buckets:[{id:"a",label:"Genuine"},{id:"b",label:"Sarcasm"},{id:"c",label:"Concealed envy"},{id:"d",label:"Ending the argument"}],
    items:[
     {t:"She has just been handed a drawing by her six-year-old.",b:"a",why:"No gap between word and meaning. Note how rarely this is the interesting option."},
     {t:"He has told her, for the third time, that he was working late.",b:"b",why:"The audience knows he is lying. The line's flatness is the weapon."},
     {t:"Her colleague announces the promotion she applied for.",b:"c",why:"The gap is hidden from the other character but not from us. This is where performance and staging carry the meaning — and why the parenthetical should stay off the page."},
     {t:"They have been shouting for two pages. He stops, and says it.",b:"d",why:"Not a comment on anything. A door closing. Dialogue that means “this conversation is over” rarely says so."}
    ]}},
  {t:"h",x:"Write the subtext",m:"reverse the exercise"},
  {t:"act",a:{kind:"write",prompt:"Two people are packing up a flat they shared. Write four lines in which one of them asks the other to stay — without either character saying “stay”, “love”, or naming the situation.",
    hint:"Give them a practical object to argue about. The object should be the only thing they can safely talk about.",
    model:"ROS\nYou're taking the kettle?\n\nDAN\nIt's my kettle.\n\nROS\nThen what am I supposed to do in the mornings?\n\nDAN\n...I'll leave the kettle."}},
  {t:"h",x:"How the gap is built",m:""},
  {t:"table",head:["Device","How it works","Cost"],rows:[
    ["Audience knows more","We hear the second meaning; the listener doesn't","Requires an earlier scene of setup"],
    ["Displacement onto an object","Characters argue about a thing, not the thing","Needs the object to be present and plausible"],
    ["Interruption and evasion","What is not answered names the subject","Can read as coy if overused"],
    ["Flat delivery of a loaded fact","The under-reaction is the reaction","Depends entirely on casting"]
  ]},
  {t:"note",x:"If you find yourself writing a parenthetical to explain the subtext, the situation is not doing the work yet. Fix the scene, not the line."}
 ]
},
/* ---------------------------------------------------------- 9 */
{
 title:"Character introduction",
 short:"Naming, describing, and what not to write",
 goal:"There are firm conventions for a character's first appearance. Learn what information belongs there and what belongs to other departments.",
 body:[
  {t:"p",x:"On first appearance a character's name is capitalised, and usually accompanied by an age and one piece of information that will matter. That is the whole convention. Everything writers add beyond it is either useful or is quietly instructing casting, wardrobe and the actor how to do their jobs."},
  {t:"h",x:"First appearance",m:"three versions"},
  {t:"table",head:["Version","On the page","What it gives us"],rows:[
    ["Bare","JOHN enters.","A name. No age, no bearing, nothing to cast against."],
    ["Conventional","JOHN, 42, enters.","Name and age. Adequate; forgettable."],
    ["Working","JOHN, 42, enters like a man returning something he has already broken.","Name, age, and behaviour that sets an expectation the scene can then confirm or betray."]
  ]},
  {t:"p",x:"The third is not better because it is more colourful. It is better because it gives the reader a prediction to hold, and the film a shot to point at."},
  {t:"h",x:"Don't describe the actor",m:"6 fragments"},
  {t:"act",a:{kind:"sort",prompt:"Sort these fragments by what they really are.",
    buckets:[{id:"f",label:"Filmable"},{id:"c",label:"Casting note"},{id:"w",label:"Wardrobe"},{id:"u",label:"Unfilmable"}],
    items:[
     {t:"stands with her weight on one hip, as if waiting to be dismissed",b:"f",why:"Behaviour. A camera can photograph it and an actor can play it."},
     {t:"strikingly beautiful, think a young Julie Christie",b:"c",why:"A casting instruction dressed as description, and one that dates fast. It gives the reader nothing to see in this scene."},
     {t:"wearing a suit that cost more than the car outside",b:"w",why:"Legitimate and useful — it says something about him — but recognise that it is a budget line and a costume note."},
     {t:"has never forgiven his brother",b:"u",why:"Backstory with no image. Keep it in your notes; it will show up as behaviour or not at all."},
     {t:"38, ex-army, still cuts his own hair",b:"f",why:"Age, history and a visible habit. “Still cuts his own hair” is filmable because you can see a bad haircut."},
     {t:"radiates quiet inner strength",b:"u",why:"Radiates nothing photographable. This is the single commonest line in amateur character introductions."}
    ]}},
  {t:"h",x:"When must a character be named?",m:"judgement"},
  {t:"act",a:{kind:"quiz",prompt:"Naming and timing.",
    qs:[
     {q:"A figure appears in the first scene, does something crucial, and is not identified until page 40. On the page you write:",
      a:["A FIGURE — capitalised, unnamed, described by what we can see","JOHN (unrecognisable) — so the reader tracks him","MYSTERIOUS MAN — and never explain"],c:0,
      why:"The reader should experience the withhold, but the cue must stay consistent so the sound and continuity departments can track the part. When identity is revealed, the cue changes — and a note tells us it is the same person."},
     {q:"Your protagonist first appears on page 9, after eight pages of other people.",
      a:["Fine, if the eight pages are interesting","Risky — the audience spends eight pages learning to follow someone else","Always wrong"],c:1,
      why:"Audiences attach to whoever they meet first and follow longest. This is a mechanical fact about attention, not a rule, and you can violate it — but you must know you are paying for it."}
    ]}}
 ]
},
/* ---------------------------------------------------------- 10 */
{
 title:"Scene geography and continuity",
 short:"Where is everybody?",
 goal:"Action lines build a space in the reader's head. If that space is contradictory, the scene cannot be shot as written. Learn to keep the geography honest.",
 body:[
  {t:"p",x:"You do not need to write a floor plan. You do need to know one. Every entrance, every crossing, every look is a spatial claim, and claims accumulate. The reader assembles them silently and only notices when they conflict — at which point they stop believing the scene."},
  {t:"h",x:"Move the characters",m:"drag the markers"},
  {t:"act",a:{kind:"geo"}},
  {t:"h",x:"Continuity challenge",m:"4 lines"},
  {t:"act",a:{kind:"quiz",prompt:"Read the action, then answer.",
    qs:[
     {q:"“Sarah sits beside John. John gets up and walks to the door. Sarah looks at him. John turns back toward her.” Where is Sarah at the end?",
      a:["At the door","Seated, where she was","Standing between the table and the door"],c:1,
      why:"Nothing moved her. Readers frequently assume characters follow each other; the page must either move her or leave her put. The look does the work across the distance — which is exactly why the distance had to be established."},
     {q:"Later the writer adds: “Sarah closes the door behind him.” What has gone wrong?",
      a:["Nothing","She has crossed the room without the page saying so","The door was never established"],c:1,
      why:"An uncosted move. On set someone will ask when she stood up, and the answer will have to be invented on the day. That is the cost of vague geography: decisions migrate from the writer to whoever is holding the script at 6am."},
     {q:"Which line best fixes it?",
      a:["“Sarah follows him to the door and closes it behind him.”","“Sarah is at the door.”","“Sarah closes the door, angrily.”"],c:0,
      why:"It restores the move, keeps the sentence in the same paragraph as the exit, and costs six words. Spatial clarity is nearly always cheap."}
    ]}},
  {t:"note",x:"Two questions will catch most geography faults in a draft: who is standing, and who can see whom? Answer both at every point in a scene and the space will hold."}
 ]
}
);
MODULES.push(
/* ---------------------------------------------------------- 11 */
{
 title:"Transitions and editing language",
 short:"CUT TO: and its relatives",
 goal:"Transitions are instructions to the edit. Learn what each one means dramatically, and why most modern scripts leave them out.",
 body:[
  {t:"p",x:"When scripts were shooting documents first and reading documents second, transitions were typed on every scene change. Today a new scene heading already means we have cut, and writing CUT TO: forty times only tells the reader you have nothing better to say. What survives are the transitions that carry meaning the cut alone would not."},
  {t:"fig",svg:"transitions",cap:"Five transitions and the edit each one describes. The vertical bar is the join between two shots; the shape above it is what the audience feels."},
  {t:"h",x:"Match the transition to its effect",m:"5 pairs"},
  {t:"act",a:{kind:"match",prompt:"Click a transition, then click the effect it produces.",
    pairs:[
     {l:"CUT TO:",r:"A neutral join. Default; usually implied rather than written.",why:"So neutral that writing it adds nothing. Use it only to force a rhythm the reader would otherwise miss."},
     {l:"SMASH CUT TO:",r:"A violent, unprepared jolt — usually loud after quiet.",why:"Earns its place perhaps twice in a script. It is a promise that the next image will hurt."},
     {l:"MATCH CUT:",r:"Two shots joined by a shared shape or motion, making an argument.",why:"The only transition that means something on its own: it claims that two things are the same thing."},
     {l:"DISSOLVE TO:",r:"A soft overlap reading as elapsed time or memory.",why:"Old-fashioned in features, still standard for time passing in television and documentary."},
     {l:"FADE IN: / FADE OUT.",r:"The film beginning or ending — a curtain, not a cut.",why:"FADE IN: is conventionally the first line of a screenplay and FADE OUT. the last. Inside the script, a fade to black is a heavy piece of punctuation."}
    ]}},
  {t:"h",x:"Choose the join",m:"Scene A to Scene B"},
  {t:"act",a:{kind:"quiz",prompt:"Two scenes. Choose the transition, or none.",
    qs:[
     {q:"A: A surgeon's hand raises a scalpel, slowly. B: A butcher's cleaver comes down on a joint of meat.",
      a:["CUT TO:","MATCH CUT:","DISSOLVE TO:"],c:1,
      why:"The shapes rhyme and the rhyme is the point. Writing MATCH CUT: here is not decoration; it is the only way the reader knows the two shots must be composed to fit."},
     {q:"A: A child sleeps. B: The same room, empty, twenty years later.",
      a:["SMASH CUT TO:","DISSOLVE TO:","No transition — the new heading is enough"],c:1,
      why:"A dissolve is the conventional signal for elapsed time, and here the elapsed time is the entire content of the join. Answer three is defensible if the heading already says TWENTY YEARS LATER."},
     {q:"A: A quiet kitchen argument ends. B: A car alarm, a smashed window, screaming.",
      a:["SMASH CUT TO:","No transition","FADE OUT."],c:0,
      why:"The one clear case for a smash cut: silence into noise, where the join itself is the shock. Note it works because you have not used it earlier."}
    ]}},
  {t:"note",x:"A reliable modern default: write FADE IN: at the top, write FADE OUT. at the bottom, and in between only write a transition when the absence of it would change how the film is cut."}
 ]
},
/* ---------------------------------------------------------- 12 */
{
 title:"Montage",
 short:"Compressing time into images",
 goal:"A montage is a formal device with its own rules: it compresses duration and it argues by juxtaposition. Learn to build one and to know when a scene would do better.",
 body:[
  {t:"p",x:"Two things happen in a montage that cannot happen in a scene. Time collapses — weeks pass in forty seconds — and images are put next to each other so that the audience draws a conclusion nobody says aloud. If your montage does neither, it is a list of shots."},
  {t:"fig",svg:"strip",cap:"A montage as a filmstrip. The meaning sits in the joins, not the frames: the empty chair means nothing until it follows the alarm clock and the coffee."},
  {t:"h",x:"Build the montage",m:"order 6 shots"},
  {t:"act",a:{kind:"order",prompt:"Six shots. Order them so the montage says: she has built a routine, and someone is missing from it.",
    items:[
     {t:"Alarm clock, 5:40am."},
     {t:"Running shoes by the door, laced."},
     {t:"Train arriving; she gets on."},
     {t:"Coffee, drunk standing up."},
     {t:"A calendar; three weeks crossed off."},
     {t:"An empty chair at the kitchen table."}
     ],
    why:"The routine builds in the order of a day, the calendar tells us it has repeated, and the empty chair lands last because the montage has spent five shots earning the absence. Put the chair first and it is information; put it last and it is the point."}},
  {t:"h",x:"What the montage does that a scene cannot",m:""},
  {t:"act",a:{kind:"multi",prompt:"Select every claim that is true of montage as a device.",
    opts:[
     {t:"Compresses a long duration into a short screen time",ok:1},
     {t:"Creates meaning by juxtaposition rather than statement",ok:1},
     {t:"Allows a character to make a decision on screen",ok:0},
     {t:"Removes the need for dialogue to explain a passage of time",ok:1},
     {t:"Can carry a scene's dramatic conflict",ok:0},
     {t:"Establishes a repeated pattern the film can later break",ok:1}
    ],
    why:"Montage is bad at decisions and bad at conflict: both need continuous time and an opponent present. It is superb at duration, pattern and implication. The pattern point matters most — a montage that establishes a routine is usually setting up the scene where the routine fails."}},
  {t:"h",x:"Formatting a montage",m:""},
  {t:"script",lines:[
   {c:"slug",t:"MONTAGE - THREE WEEKS ALONE"},
   {c:"act",t:"-- The alarm at 5:40. She is already awake."},
   {c:"act",t:"-- Coffee, standing up, coat on."},
   {c:"act",t:"-- The 6:12 train. She always takes the same seat."},
   {c:"act",t:"-- A calendar. Three weeks crossed through."},
   {c:"act",t:"-- The kitchen table. One chair pushed in."},
   {c:"trn",t:"END MONTAGE."}
  ]},
  {t:"note",x:"Give the montage a title that states its argument — “THREE WEEKS ALONE”, not “MONTAGE”. It costs one line and tells everyone reading what the sequence has to achieve."}
 ]
},
/* ---------------------------------------------------------- 13 */
{
 title:"Parallel action",
 short:"Intercutting two lines at once",
 goal:"Two things happening at once is a technical problem before it is a dramatic one. Learn how to write it, and how often to re-establish where we are.",
 body:[
  {t:"fig",svg:"parallel",cap:"Two tracks, one clock. The value of parallel action is that the audience holds both lines simultaneously and calculates the gap between them."},
  {t:"h",x:"Intercut the two lines",m:"8 beats"},
  {t:"act",a:{kind:"order",prompt:"Order the eight beats as they would appear in the script, so the two lines converge.",
    items:[
     {t:"SARAH — The phone rings."},
     {t:"JOHN — Driving, radio on, thinking about nothing."},
     {t:"SARAH — She answers."},
     {t:"JOHN — Traffic stops dead."},
     {t:"SARAH — She hears the news."},
     {t:"JOHN — He checks his phone. Nine missed calls."},
     {t:"SARAH — She runs outside, looking down the road."},
     {t:"JOHN — He turns the car around."}
    ],
    why:"Strict alternation, because the two lines are asking the same question — when will he find out? — and the audience needs to feel the delay. Alternation is not compulsory; grouping three beats on one side stretches the tension, and the choice is a rhythm decision you should make consciously."}},
  {t:"h",x:"Writing it on the page",m:"two methods"},
  {t:"table",head:["Method","How it reads","Best for"],rows:[
    ["Separate headings","Full scene heading for each cut back and forth","Locations the audience does not know yet; long sequences"],
    ["INTERCUT","Establish both, then write INTERCUT BETWEEN SARAH AND JOHN and run the beats without further headings","Phone calls and chases, once both spaces are established"]
  ]},
  {t:"script",lines:[
   {c:"slug",t:"INT. SARAH'S KITCHEN - NIGHT"},
   {c:"act",t:"Sarah picks up. Nothing on the line but road noise."},
   {c:"slug",t:"INT. JOHN'S CAR - MOVING - NIGHT"},
   {c:"act",t:"John, phone to his ear, headlights coming the other way."},
   {c:"trn",t:"INTERCUT SARAH / JOHN"},
   {c:"chr",t:"JOHN"},{c:"dlg",t:"Don't go outside."},
   {c:"chr",t:"SARAH"},{c:"dlg",t:"I'm already outside."}
  ]},
  {t:"act",a:{kind:"quiz",prompt:"One judgement about re-establishing.",
    qs:[
     {q:"You are eight pages into an intercut chase. When must you write a fresh scene heading?",
      a:["Every second beat, for clarity","When either party moves to a new location, or after a long stretch on one side","Never — INTERCUT covers the whole sequence"],c:1,
      why:"INTERCUT licenses you to drop headings, not to abandon geography. A location change or a long single-sided run leaves the reader unmoored; a fresh heading resets them for one line's cost."}
    ]}}
 ]
},
/* ---------------------------------------------------------- 14 */
{
 title:"Dramatic structure",
 short:"The three-act paradigm, built by hand",
 goal:"Construct the model rather than memorising it — then use it as a diagnostic instrument on a broken script.",
 body:[
  {t:"note",x:"A note on the name: the framework usually meant here is Syd Field's paradigm, set out in Screenplay (1979). It is one model among several — others worth knowing are Hauge's six stages, Snyder's beat sheet, and the sequence approach in Module 15. None is a law; all are ways of talking about where pressure sits."},
  {t:"p",x:"Field's claim is narrow and useful. A screenplay divides into a setup, a confrontation of roughly double the length, and a resolution; the divisions are marked by two plot points where the story turns and heads in a new direction. Everything else attributed to the model was added later by people selling seminars."},
  {t:"h",x:"Build the model",m:"7 stages"},
  {t:"act",a:{kind:"order",prompt:"Put the stages in order, from first page to last.",
    items:[
     {t:"Setup — the world, and what is missing from it"},
     {t:"Disturbance — something arrives that cannot be ignored"},
     {t:"Plot point one — a decision that makes retreat impossible"},
     {t:"Escalation — attempts that cost more each time"},
     {t:"Plot point two — the last thing goes wrong"},
     {t:"Climax — the confrontation the whole film has been arranging"},
     {t:"Resolution — the new normal, briefly"}
    ],
    why:"The two plot points are doing the structural work: the first converts a situation into a commitment, the second removes the last option. Notice that nothing here specifies content. That is the model's strength and the reason it is often misused as a template."}},
  {t:"fig",svg:"paradigm",cap:"The paradigm at feature length. Act two is as long as acts one and three combined — which is why most structural trouble is act-two trouble."},
  {t:"h",x:"Structure diagnosis",m:"a broken script"},
  {t:"p",x:"A 100-page script arrives. The inciting event happens on page 42. The major reversal happens on page 48. The protagonist achieves the goal on page 53."},
  {t:"act",a:{kind:"quiz",prompt:"Diagnose it.",
    qs:[
     {q:"What is the primary structural problem?",
      a:["The inciting incident is too late and the story is over by the midpoint","There is no midpoint","The reversal is too close to the inciting incident"],c:0,
      why:"Both other observations are true, but they are symptoms. Forty-two pages of setup means the audience has waited most of an hour for the film to start, and resolving on page 53 leaves 47 pages with no engine."},
     {q:"What are pages 1–42 most likely to be?",
      a:["A slow burn","Backstory the writer needed to know and the audience does not","A subplot"],c:1,
      why:"This is the commonest first-draft shape in existence. The writer discovered the story by writing towards it. The fix is almost never trimming: it is starting the film at page 40 and feeding the necessary parts of the first 42 pages back in through behaviour."},
     {q:"What happens to pages 54–100?",
      a:["They become act three","They are a new, unannounced second story","They resolve subplots"],c:1,
      why:"Once the goal is achieved, a fresh set of problems must be invented to fill the time, and audiences feel the seam without being able to name it. Two half-films joined at the waist."}
    ]}}
 ]
},
/* ---------------------------------------------------------- 15 */
{
 title:"Sequences",
 short:"Beat, scene, sequence, act",
 goal:"Learn the four nested units of screen storytelling and where a sequence — the most useful and least taught of them — sits.",
 body:[
  {t:"p",x:"A beat is a change. A scene is continuous action in one place and time. A sequence is a run of scenes bound by a single objective, with its own beginning, escalation and turn. An act is a large movement of the whole story. Most writers work fluently at the level of the scene and the act, and get lost in between — which is exactly where sequences live."},
  {t:"fig",svg:"nesting",cap:"The four units, nested. A feature is roughly eight sequences; that is where the old eight-reel structure came from, and it remains the most practical way to plan a middle act."},
  {t:"h",x:"Sort by unit",m:"8 examples"},
  {t:"act",a:{kind:"sort",prompt:"Which unit is each example?",
    buckets:[{id:"b",label:"Beat"},{id:"s",label:"Scene"},{id:"q",label:"Sequence"},{id:"a",label:"Act"}],
    items:[
     {t:"She stops asking and starts threatening.",b:"b",why:"A change of tactic inside a conversation."},
     {t:"The argument in the garage, from her arrival to his exit.",b:"s",why:"Continuous, one place, one stretch of time."},
     {t:"Getting the passport: four scenes across two days, ending with the forger refusing.",b:"q",why:"Multiple scenes, one objective, its own turn at the end. This is a sequence."},
     {t:"He puts the keys on the workbench.",b:"b",why:"The moment the scene reverses."},
     {t:"Everything up to the decision to leave the country.",b:"a",why:"A whole movement, ending on a plot point."},
     {t:"The border crossing, from the queue to the far side.",b:"q",why:"Several scenes under one pressure, with a clear success or failure at the end."},
     {t:"Two people on a bench, not talking, for ninety seconds.",b:"s",why:"One place, one continuous time. Short, but a scene."},
     {t:"The hour in which everything he arranged collapses.",b:"a",why:"Too large for a sequence, and defined by its structural function rather than a single objective."}
    ]}},
  {t:"h",x:"Build a sequence",m:"5 scene cards"},
  {t:"act",a:{kind:"order",prompt:"Five scenes with one objective: get into the records office before it closes. Order them.",
    items:[
     {t:"She calls ahead and is told the office closes at four."},
     {t:"She talks her way past reception with an expired card."},
     {t:"The clerk asks for a reference number she does not have."},
     {t:"She finds the number on a noticeboard in the corridor."},
     {t:"The file is gone; someone signed it out this morning."}
    ],
    why:"Objective, obstacle, worse obstacle, apparent solution, turn. The sequence ends on a reversal that starts the next one — who signed it out? A sequence that ends with the objective simply achieved has to hand the story a new problem from outside, which always feels arbitrary."}},
  {t:"table",head:["Sequence part","Question it answers"],rows:[
   ["Objective","What must be achieved before this run of scenes can end?"],
   ["Escalation","Why is each attempt more costly than the last?"],
   ["Turning point","What makes the objective irrelevant, impossible, or bigger?"],
   ["Result","What does the protagonist have now that they did not have before?"]
  ]}
 ]
}
);
MODULES.push(
/* ---------------------------------------------------------- 16 */
{
 title:"Setup and payoff",
 short:"The Chekhov timeline",
 goal:"Plant, develop, pay off. Learn the distances involved and what an audience feels when one of the three is missing.",
 body:[
  {t:"p",x:"A payoff without a setup is a coincidence. A setup without a payoff is a loose thread the audience will remember longer than you will. The middle term is the one writers forget: between planting and firing, the object usually needs one appearance that makes it feel like furniture rather than a plant."},
  {t:"h",x:"The Chekhov timeline",m:"place 3 markers"},
  {t:"act",a:{kind:"place",prompt:"A locked box matters in the final act. Place the three appearances on a 110-page script. Click a card, then click the ruler.",
    max:110,tol:10,
    marks:[
     {label:"Setup — the box is mentioned in passing",page:12},
     {label:"Development — someone tries the lid, casually",page:52},
     {label:"Payoff — the box is opened",page:88}
    ],
    why:"Early enough that the audience forgets it consciously, late enough that they still hold it somewhere. The middle appearance is what stops the payoff feeling convenient: it establishes that other people wanted in too."}},
  {t:"fig",svg:"chekhov",cap:"Setup, development, payoff across a feature. The dotted line is audience memory: it decays, which is why a plant made once on page 12 and cashed on page 88 usually needs a reminder in between."},
  {t:"h",x:"Missing terms",m:"3 diagnoses"},
  {t:"act",a:{kind:"quiz",prompt:"What does the audience experience?",
    qs:[
     {q:"The payoff arrives with no setup at all: the hero happens to have exactly the tool required.",
      a:["Relief","A cheat — the writer's hand becomes visible","Surprise"],c:1,
      why:"The technical term is deus ex machina and the audience's word for it is “oh, come on”. Note that the fix costs one line, ninety pages earlier."},
     {q:"The setup is planted twice, heavily, with a lingering shot.",
      a:["Good — clarity","The payoff is now predictable and the tension moves elsewhere","No effect"],c:1,
      why:"Over-planting does not ruin a film, but it converts surprise into anticipation. Sometimes that is exactly what you want — in suspense, telling the audience about the gun is the whole technique. Know which effect you are buying."},
     {q:"The setup is planted and never paid off.",
      a:["Nobody notices","The audience holds an open question through the ending and reads it as untidiness","It creates mystery"],c:1,
      why:"Audiences are extraordinary at remembering unresolved plants and terrible at articulating why an ending felt loose. In revision, list every plant and find its payoff — or cut the plant."}
    ]}},
  {t:"note",x:"A practical revision pass: read the script backwards, scene by scene, and for every important object, skill or fact, find the page where the audience first met it. Anything you cannot find is a coincidence waiting to be noticed."}
 ]
},
/* ---------------------------------------------------------- 17 */
{
 title:"Information management",
 short:"Who knows what, and when",
 goal:"Suspense, surprise and dramatic irony are not moods. They are arithmetic on three quantities: what the audience knows, what the protagonist knows, and what other characters know.",
 body:[
  {t:"p",x:"Hitchcock's illustration is still the clearest. Two people talk at a table and a bomb goes off: fifteen seconds of shock. Show the audience the bomb under the table first, and the same scene delivers fifteen minutes of suspense. Nothing changed except who knew what, and when."},
  {t:"h",x:"Audience knowledge tracker",m:"set the tracks"},
  {t:"act",a:{kind:"know"}},
  {t:"h",x:"The three states",m:""},
  {t:"table",head:["State","Condition","What it buys"],rows:[
   ["Suspense","Audience knows, protagonist does not","Dread, and every ordinary action becomes charged"],
   ["Surprise","Nobody knows until it happens","A single strong jolt, then it is spent"],
   ["Dramatic irony","Audience knows more than a character who is speaking","Every line acquires a second meaning"],
   ["Mystery","A character knows, the audience does not","Curiosity — the audience leans in rather than shrinking back"]
  ]},
  {t:"act",a:{kind:"quiz",prompt:"Two applications.",
    qs:[
     {q:"A thriller keeps the killer's identity from the audience until page 95. What has the writer chosen?",
      a:["Suspense throughout","Mystery throughout and one surprise at the end","Dramatic irony"],c:1,
      why:"A legitimate choice, but note what it costs: no scene before page 95 can carry the dread of watching the victim talk to the killer. You have traded ninety pages of suspense for one page of surprise."},
     {q:"You want the audience to fear for a character during an ordinary breakfast scene. What is the minimum change?",
      a:["Add ominous dialogue","Show the audience, earlier, something the character does not know","Cut to a shot of the threat during the scene"],c:1,
      why:"Answer three works too, but it interrupts. The cheapest and strongest option is a prior scene: after it, the breakfast plays itself, and every mundane line is loaded without a word being changed."}
    ]}},
  {t:"note",x:"Keep an actual knowledge grid while drafting a thriller — a column per character plus one for the audience, a row per major fact. Most plot holes are not logic failures; they are moments where somebody knows something the grid says they cannot."}
 ]
},
/* ---------------------------------------------------------- 18 */
{
 title:"Revision as diagnosis",
 short:"Seven questions, one map",
 goal:"Rewriting is not re-inspiration. It is a repeatable diagnostic pass. Run a scene through seven questions and read the result.",
 body:[
  {t:"p",x:"The questions below are ordered deliberately: each one depends on the answer to the last. If you cannot answer question one, questions two to seven are unanswerable, and the problem is not in the dialogue."},
  {t:"h",x:"Scene under examination",m:""},
  {t:"script",lines:[
   {c:"slug",t:"INT. CAR SHOWROOM - DAY"},
   {c:"act",t:"TOMAS, 50s, in yesterday's shirt, walks a gleaming saloon like a man inspecting a horse. LEAH, 20s, salesperson, keeps pace."},
   {c:"chr",t:"LEAH"},{c:"dlg",t:"It's the last one at this price."},
   {c:"chr",t:"TOMAS"},{c:"dlg",t:"My daughter's getting married in June."},
   {c:"chr",t:"LEAH"},{c:"dlg",t:"Congratulations."},
   {c:"act",t:"He opens the driver's door and doesn't get in."},
   {c:"chr",t:"TOMAS"},{c:"dlg",t:"She asked her stepfather to give her away."},
   {c:"act",t:"Leah says nothing. Tomas closes the door, gently."},
   {c:"chr",t:"TOMAS"},{c:"dlg",t:"I'll take it."}
  ]},
  {t:"h",x:"The diagnostic",m:"7 questions"},
  {t:"act",a:{kind:"diag"}},
  {t:"note",x:"Run this on three consecutive scenes and a second pattern appears: if all three answer question three the same way, the sequence is repeating itself, and one of the scenes is redundant no matter how good it is."}
 ]
},
/* ---------------------------------------------------------- 19 */
{
 title:"Formatting mastery",
 short:"Fix the page, then race the clock",
 goal:"Fluency, not knowledge. You should be able to see a formatting fault the way a musician hears a wrong note.",
 body:[
  {t:"h",x:"Fix the screenplay",m:"7 faults"},
  {t:"p",x:"This page contains seven deliberate faults. Click every line that is wrong."},
  {t:"act",a:{kind:"trim",prompt:"Click the faulty lines. Correct lines cost you nothing if left alone.",
    mode:"mark",need:7,
    lines:[
     {c:"slug",t:"INT- kitchen, night",k:1,why:"Malformed heading: wrong separator, lower case, comma instead of a dash. Should read INT. KITCHEN - NIGHT."},
     {c:"act",t:"Sarah walked into the room and was feeling anxious about the meeting.",k:1,why:"Past tense and an unfilmable interior state. Action is present tense and photographable."},
     {c:"chr",t:"Sarah",k:1,why:"Character cues are capitalised."},
     {c:"par",t:"(she crosses to the window, pours a drink and stares out at the rain)",k:1,why:"Action smuggled into a parenthetical. Move it to an action line."},
     {c:"dlg",t:"Is he here yet?"},
     {c:"chr",t:"JOHN (O.S.)"},
     {c:"dlg",t:"“In the garden.”",k:1,why:"Dialogue does not take quotation marks; the indentation already marks it as speech."},
     {c:"act",t:"CLOSE UP ON SARAH'S FACE as we PUSH IN slowly and then PAN LEFT to the door.",k:1,why:"Excessive camera direction. Three shot instructions in one line is the director's job, and it stops the read dead."},
     {c:"trn",t:"CUT TO:"},
     {c:"trn",t:"AND THEN WE CUT TO:",k:1,why:"Not a transition. Transitions are a fixed vocabulary; invented ones read as amateur."},
     {c:"slug",t:"EXT. GARDEN - CONTINUOUS"}
    ],
    why:"Seven faults: the heading, the past-tense interiority, the lower-case cue, the action-in-parenthetical, the quotation marks, the camera pile-up and the invented transition. The two plain CUT TO: and the correct heading were fine — though a modern draft would cut the CUT TO: as well."}},
  {t:"h",x:"Speed round",m:"12 questions, 3 minutes"},
  {t:"act",a:{kind:"speed"}}
 ]
},
/* ---------------------------------------------------------- 20 */
{
 title:"The screenplay lab",
 short:"Build one from components",
 goal:"Not an exam. A production line: premise, character, objective, structure, sequences, scene cards, beats, page. Fill each stage and the course hands you a working outline.",
 body:[
  {t:"p",x:"Every stage below is locked until the one above it is answered, because that is the actual dependency: you cannot card out a sequence whose objective you have not decided, and you cannot decide an objective without a character who wants something. Work down the pipeline. At the bottom you can export the whole thing as a text file and start writing pages."},
  {t:"act",a:{kind:"lab"}},
  {t:"h",x:"What to do with it",m:""},
  {t:"ul",items:[
   "Write the eight sequences as one line each before writing a single scene. If a sequence cannot be stated in one line, it is two sequences or none.",
   "Card the sequence you are least sure about first. The trouble is always there, and finding it on a card costs a day rather than a month.",
   "Draft fast and badly to the end. A finished bad draft is a diagnosable object; forty perfect pages are not.",
   "Then run every scene through Module 18's seven questions, and every plant through Module 16's backwards pass."
  ]},
  {t:"note",x:"The technical craft in this course is not the point of writing a screenplay. It is what stops the point from being lost between your head and a set at six in the morning."}
 ]
}
);
/* ============================================================
   Figures — all drawn as inline SVG so the page stays one file
   ============================================================ */
const INK="#1B1B1B", RULE="#D7D3C8", SOFT="#7B7A73", MONO="'Courier Prime','Courier New',monospace", UI="Archivo,Helvetica,Arial,sans-serif";

const FIGS = {
