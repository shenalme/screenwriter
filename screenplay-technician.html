};
/* ============================================================
   Engine
   ============================================================ */
const $=(s,r)=>(r||document).querySelector(s);
const cleared=new Set();
let current=-1;

function E(tag,attrs,kids){
  const n=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class")n.className=attrs[k];
    else if(k==="html")n.innerHTML=attrs[k];
    else if(k==="text")n.textContent=attrs[k];
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(c=>c&&n.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return n;
}
function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b.every((x,i)=>x===a[i])&&a.length>1?shuffle(a):b;
}
function verdict(node,cls,html){
  let v=node.querySelector(".verdict.live");
  if(!v){v=E("div",{class:"verdict live"});node.appendChild(v);}
  v.className="verdict live "+cls; v.innerHTML=html; return v;
}
function markCleared(i){
  if(cleared.has(i))return;
  cleared.add(i); paintTabs(); paintProgress();
}
function paintProgress(){
  const pct=(cleared.size/MODULES.length)*100;
  $("#rulerFill").style.width=pct+"%";
  $("#ruler").setAttribute("aria-valuenow",cleared.size);
  $("#count").textContent=cleared.size+"/"+MODULES.length+" modules cleared";
}

/* ---------------- activity renderers ---------------- */
const ACT={};

ACT.hotspot=(a,done)=>{
  const w=E("div"),seen=new Set();
  w.appendChild(E("p",{class:"prompt",text:a.prompt}));
  const sc=E("div",{class:"script"});
  const info=E("div",{class:"verdict info",html:"<b>Nothing selected.</b> Click any line above."});
  a.lines.forEach((l,i)=>{
    const b=E("button",{class:"el "+l.c,text:l.t,type:"button",onclick:()=>{
      sc.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); seen.add(i);
      info.className="verdict info"; info.innerHTML="<b>"+l.el+".</b> "+l.why;
      if(seen.size===a.lines.length)done();
    }});
    sc.appendChild(b);
  });
  w.appendChild(sc); w.appendChild(info);
  return w;
};

ACT.pick=(a,done)=>{
  const w=E("div"); let i=0,score=0;
  w.appendChild(E("p",{class:"prompt",text:a.prompt}));
  const stage=E("div",{class:"script"}),opts=E("div",{class:"chips"}),out=E("div");
  const draw=()=>{
    const it=a.items[i];
    stage.innerHTML=""; stage.appendChild(E("span",{class:"el "+it.c,text:it.t}));
    opts.innerHTML="";
    a.options.forEach((o,oi)=>opts.appendChild(E("button",{class:"chip ui",text:o,type:"button",onclick:e=>{
      const right=oi===it.a; if(right)score++;
      opts.querySelectorAll("button").forEach(b=>b.disabled=true);
      e.target.classList.add(right?"ok":"no");
      if(!right)opts.children[it.a].classList.add("ok");
      verdict(out,right?"ok":"no","<b>"+(right?"Correct.":"Not quite.")+"</b> "+it.why);
      setTimeout(()=>{ i++; if(i<a.items.length){draw(); out.innerHTML="";}
        else{ verdict(out,score===a.items.length?"ok":"info","<b>"+score+" of "+a.items.length+".</b> "+(score===a.items.length?"Clean sweep. You can read the page as a technical document now.":"Re-read the misses above; the position on the page is usually the giveaway.")); done(); } },1400);
    }})));
  };
  draw(); w.appendChild(stage); w.appendChild(opts); w.appendChild(out);
  return w;
};

ACT.quiz=(a,done)=>{
  const w=E("div"); let answered=0;
  if(a.prompt)w.appendChild(E("p",{class:"prompt",text:a.prompt}));
  a.qs.forEach(q=>{
    const box=E("div",{class:"qbox"});
    box.appendChild(E("p",{class:"body",text:q.q}));
    const ch=E("div",{class:"chips"});

  const row=E("div",{class:"row"});
  row.appendChild(E("button",{class:"btn",text:"Check against the brief",type:"button",onclick:()=>{
    const want={aud:[1,1,1,1],sar:[0,0,1,1]};
    const ok=["aud","sar"].every(k=>st[k].every((v,i)=>v===want[k][i]));
    verdict(w,ok?"ok":"info","<b>"+(ok?"That is the suspense build.":"The configuration the brief describes is: audience knows from page 20; Sarah does not until page 40.")+"</b> Pages 20 and 35 then play as suspense — she is alone in the house doing ordinary things, and every ordinary thing is unbearable. Page 40 is the discovery, and from there the film converts suspense into shared alarm, which is a different and shorter-lived engine. Turn the audience's first two cells off and you have swapped ninety seconds of dread for one second of shock.");
    done();
  }}));
  w.appendChild(row);
  return w;
};

ACT.diag=(a,done)=>{
  const qs=[
   {q:"1. Who wants what?",m:"Tomas wants the car. Underneath: he wants to be a man whose daughter would have asked him."},
   {q:"2. What prevents them getting it?",m:"Nothing external — Leah will sell him anything. The obstacle is internal and unstated, which is why the scene is quiet."},
   {q:"3. What changes during the scene?",m:"He stops shopping and starts buying. The purchase becomes compensation rather than transport."},
   {q:"4. What information does the audience receive?",m:"A wedding in June, a stepfather, a daughter who chose him instead, and a man in yesterday's shirt with money to spend."},
   {q:"5. What information is withheld?",m:"Everything about how it got this way. The scene refuses the backstory and is stronger for it."},
   {q:"6. Where is the turning point?",m:"“She asked her stepfather to give her away.” Everything before is a man looking at a car; everything after is a man buying something else."},
   {q:"7. What is different at the end?",m:"He owns a car he did not come in for, and we know the price of it. Leah's silence is the scene's only mercy."}
  ];
  const w=E("div"),inputs=[];
  qs.forEach(x=>{
    w.appendChild(E("label",{class:"q",text:x.q}));
    const t=E("textarea",{class:"write",style:"min-height:56px","aria-label":x.q});
    inputs.push(t); w.appendChild(t);
  });
  const row=E("div",{class:"row"});
  row.appendChild(E("button",{class:"btn",text:"Produce the diagnostic map",type:"button",onclick:()=>{
    const filled=inputs.filter(t=>t.value.trim().length>3).length;
    if(filled<4){verdict(w,"no","<b>Answer at least four questions first.</b> The map is a comparison, not a lecture.");return;}
    let html="<b>Diagnostic map — CAR SHOWROOM</b>";
    qs.forEach((x,i)=>{
      html+="<div style='margin:10px 0;padding-left:12px;border-left:2px solid rgba(0,0,0,.15)'><div style='font-weight:600'>"+x.q+"</div>"+
            "<div style='font-family:"+MONO+";font-size:13px;margin:4px 0'>you: "+(inputs[i].value.trim()||"—")+"</div>"+
            "<div style='font-size:13.5px;color:#33413A'>one reading: "+x.m+"</div></div>";
    });
    html+="<div style='margin-top:10px'>Where your answer and the reading diverge is not an error — it is the scene being ambiguous, and ambiguity you did not intend is the thing revision exists to find.</div>";
    verdict(w,"info",html); done();
  }}));
  w.appendChild(row);
  return w;
};

ACT.speed=(a,done)=>{
  const QS=[
   ["INT. means the camera is inside.",1],
   ["Character cues are written in lower case.",0],
   ["Dialogue takes quotation marks.",0],
   ["CONTINUOUS means time runs on from the previous scene.",1],
   ["Action is written in the past tense.",0],
   ["A parenthetical may contain a full paragraph of action.",0],
   ["One formatted page runs roughly one minute.",1],
   ["A new scene heading implies a cut.",1],
   ["A character's name is capitalised on every appearance in action.",0],
   ["(O.S.) means the speaker is off screen but present in the space.",1],
   ["MATCH CUT joins two shots by a shared shape or motion.",1],
   ["Scene headings should include the shot size.",0]
  ];
  const w=E("div"); let i=0,score=0,t=180,timer=null,live=true;
  const bar=E("div",{class:"timerbar"});
  const clock=E("span",{class:"clock",text:"3:00"});
  bar.appendChild(clock); bar.appendChild(E("span",{class:"hint",style:"margin:0",text:"12 questions"}));
  const qEl=E("p",{class:"prompt"}),ch=E("div",{class:"chips"}),out=E("div");
  const finish=()=>{
    live=false; clearInterval(timer); ch.innerHTML=""; qEl.textContent="";
    const pct=Math.round((score/QS.length)*100);
    const rank=pct>=90?"Script supervisor":pct>=75?"Screenplay technician":pct>=50?"Staff writer, second draft":"Reader, page one";
    out.innerHTML="";
    out.appendChild(E("div",{class:"score",html:"<b>"+rank+" — "+pct+"%</b><br>"+score+" of "+QS.length+" correct with "+t+"s left on the clock."}));
    out.appendChild(E("div",{class:"row"},[E("button",{class:"btn ghost",text:"Run it again",type:"button",onclick:()=>{i=0;score=0;t=180;live=true;out.innerHTML="";start();}})]));
    done();
  };
  const draw=()=>{
    if(i>=QS.length)return finish();
    qEl.textContent=(i+1)+". "+QS[i][0];
    ch.innerHTML="";
    ["True","False"].forEach((lab,li)=>ch.appendChild(E("button",{class:"chip ui",text:lab,type:"button",onclick:e=>{
      if(!live)return;
      const right=(li===0?1:0)===QS[i][1];
      if(right)score++;
      e.target.classList.add(right?"ok":"no");
      i++; setTimeout(draw,180);
    }})));
  };
  const start=()=>{
    clearInterval(timer);
    timer=setInterval(()=>{
      if(!document.body.contains(w)){clearInterval(timer);return;}
      t--; clock.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
      if(t<=0)finish();
    },1000);
    (window.__timers=window.__timers||[]).push(timer);
    draw();
  };
  w.appendChild(bar); w.appendChild(qEl); w.appendChild(ch); w.appendChild(out);
  w.appendChild(E("div",{class:"row"},[E("button",{class:"btn",text:"Start the clock",type:"button",onclick:e=>{e.target.remove();start();}})]));
  return w;
};

ACT.lab=(a,done)=>{
  const stages=[
   {k:"premise",h:"Premise",p:"One sentence. Who, in what situation, wants what, against what.",ph:"A retired border guard must smuggle his own grandson across the line he spent thirty years defending."},
   {k:"character",h:"Protagonist",p:"Name, age, and the one thing they will not do — because that is what the film will require of them.",ph:"Emil, 63. Will not break a rule. Has never broken one."},
   {k:"objective",h:"Dramatic objective",p:"What must be achieved by the last page, stated so that failure is possible.",ph:"Get the boy over the border before the new checkpoint opens on Monday."},
   {k:"structure",h:"Two plot points",p:"The decision that makes retreat impossible, and the last thing that goes wrong.",ph:"PP1: he hides the boy in the guardhouse. PP2: his old partner recognises the boy's coat."},
   {k:"sequences",h:"Sequence outline",p:"Six to eight lines, one objective each.",ph:"1. The boy arrives. 2. Getting papers. 3. The forger refuses. 4. The guardhouse. 5. The partner. 6. The crossing."},
   {k:"cards",h:"Scene cards for one sequence",p:"Break a single sequence into scenes. One line each.",ph:"Forger's flat, night — Emil offers money. / Café — the forger's wife warns him. / Car — Emil counts what is left."},
   {k:"beats",h:"Beat sheet for one scene",p:"Goal, resistance, tactic, escalation, reversal.",ph:"Goal: get papers. Resistance: forger says no. Tactic: Emil offers the medal. Escalation: forger laughs. Reversal: the wife takes it."},
   {k:"pages",h:"First page",p:"Write the opening in correct format. Scene heading, action, then whatever the film needs.",ph:"EXT. BORDER ROAD - PRE-DAWN\n\nA line of frost across the tarmac, exactly where the line is."}
  ];
  const w=E("div"),vals={},pipe=E("div",{class:"pipe"});
  const paint=()=>{
    pipe.innerHTML="";
    stages.forEach((s,i)=>{
      const prevOK=i===0||(vals[stages[i-1].k]||"").trim().length>3;
      const st=E("div",{class:"st"+(prevOK?"":" locked")});
      st.appendChild(E("h4",{text:(i+1)+". "+s.h}));
      st.appendChild(E("p",{text:s.p}));
      if(prevOK){
        const ta=E("textarea",{class:"write",style:"min-height:"+(i>=4?86:56)+"px",placeholder:s.ph,"aria-label":s.h});
        ta.value=vals[s.k]||"";
        ta.addEventListener("input",()=>{vals[s.k]=ta.value;});
        ta.addEventListener("change",()=>{vals[s.k]=ta.value;paint();});
        st.appendChild(ta);
      } else st.appendChild(E("p",{class:"hint",text:"Answer the stage above to open this one."}));
      pipe.appendChild(st);
    });
  };
  paint(); w.appendChild(pipe);
  const row=E("div",{class:"row"});
  row.appendChild(E("button",{class:"btn",text:"Assemble the outline",type:"button",onclick:()=>{
    const filled=stages.filter(s=>(vals[s.k]||"").trim().length>3);
    if(filled.length<3){verdict(w,"no","<b>Fill at least the first three stages.</b> Premise, protagonist and objective are the only stages that cannot be borrowed from anywhere else.");return;}
    let txt="SCREENPLAY OUTLINE\n"+"=".repeat(60)+"\n\n";
    stages.forEach((s,i)=>{ txt+=(i+1)+". "+s.h.toUpperCase()+"\n"+(vals[s.k]||"[ not yet written ]")+"\n\n"; });
    txt+="=".repeat(60)+"\nNext: draft to the end without stopping, then run every scene\nthrough the seven diagnostic questions in Module 18.\n";
    const blob=new Blob([txt],{type:"text/plain"});
    const url=URL.createObjectURL(blob);
    const v=verdict(w,"ok","<b>Outline assembled — "+filled.length+" of 8 stages.</b><pre style='font:13px "+MONO+";white-space:pre-wrap;max-height:260px;overflow:auto;margin:8px 0;background:#fff;padding:10px;border:1px solid "+RULE+"'>"+txt.replace(/</g,"&lt;")+"</pre>");
    const dl=E("a",{href:url,download:"screenplay-outline.txt",class:"btn",style:"text-decoration:none;display:inline-block",text:"Download as a text file"});
    v.appendChild(dl); done();
  }}));
  w.appendChild(row);
  return w;
};

/* ---------------- page rendering ---------------- */
function renderBlock(b,done){
  switch(b.t){
    case "p": return E("p",{class:"body",text:b.x});
    case "h": return E("h2",{class:"sec"},[E("span",{text:b.x}),b.m?E("em",{text:b.m}):null]);
    case "note": return E("div",{class:"note",text:b.x});
    case "ul": return E("ul",{class:"plain"},b.items.map(i=>E("li",{text:i})));
    case "fig": return E("figure",{class:"fig"},[E("div",{html:FIGS[b.svg]||""}),E("figcaption",{text:b.cap})]);
    case "table": {
      const t=E("table",{class:"cmp"});
      t.appendChild(E("thead",{},[E("tr",{},b.head.map(h=>E("th",{text:h})))]));
      t.appendChild(E("tbody",{},b.rows.map(r=>E("tr",{},r.map((c,ci)=>E("td",{class:ci?"":"m",text:c}))))));
      return t;
    }
    case "script": {
      const s=E("div",{class:"script"});
      b.lines.forEach(l=>s.appendChild(E("span",{class:"el "+l.c,text:l.t})));
      return s;
    }
    case "act": return (ACT[b.a.kind]||(()=>E("div")))(b.a,done);
  }
  return E("div");
}

function renderModule(i){
  current=i;
  (window.__timers||[]).forEach(clearInterval); window.__timers=[];
  const m=MODULES[i],[sname,scol]=STOCK[i];
  const page=$("#page");
  page.style.setProperty("--stock",scol);
  page.innerHTML="";
  page.appendChild(E("div",{class:"stockchip"},[E("i"),E("span",{text:"Module "+(i+1)+" of 20 · "+sname+" pages"})]));
  page.appendChild(E("h1",{class:"mod",text:m.title}));
  page.appendChild(E("p",{class:"goal",text:m.goal}));
  const done=()=>markCleared(i);
  m.body.forEach(b=>page.appendChild(renderBlock(b,done)));
  paintPager(i); paintTabs();
  page.focus(); window.scrollTo(0,0);
  document.title=m.title+" — Screenplay Technician";
}

function renderHome(){
  current=-1;
  const page=$("#page");
  page.style.setProperty("--stock","#FAF9F6");
  page.innerHTML="";
  const tp=E("div",{class:"titlepage"});
  tp.appendChild(E("h1",{text:"Screenplay Technician"}));
  tp.appendChild(E("div",{class:"by",html:"a course in the technical craft<br>of writing for the screen"}));
  tp.appendChild(E("div",{class:"fade",text:"FADE IN:"}));
  page.appendChild(tp);
  page.appendChild(E("p",{class:"body",style:"margin-top:26px",text:"Twenty modules on what a screenplay is doing as a document: how the page is built, how it converts into time, and how information is released. Every module is worked rather than watched — you assemble slug lines, cut dialogue, place structural landmarks, hunt formatting faults, and finish by building an outline you can take away."}));
  page.appendChild(E("p",{class:"body",text:"Nothing here is about inspiration. The claim is narrower and more useful: most of what separates an unreadable script from a professional one is technique that can be taught in an afternoon and drilled in a fortnight."}));
  page.appendChild(E("div",{class:"note",text:"Progress is kept for this session only. Work through in order if you can — Module 18 uses the diagnostics from 5, 6 and 17, and Module 20 uses all of it."}));
  page.appendChild(E("h2",{class:"sec"},[E("span",{text:"The modules"}),E("em",{text:"20 · colour-coded by revision stock"})]));
  const grid=E("div",{class:"homegrid"});
  MODULES.forEach((m,i)=>{
    const c=E("button",{class:"card",style:"--s:"+STOCK[i][1],type:"button",onclick:()=>go(i)});
    c.appendChild(E("span",{class:"n",text:"Module "+(i+1)}));
    c.appendChild(E("b",{text:m.title}));
    c.appendChild(E("span",{text:m.short}));
    grid.appendChild(c);
  });
  page.appendChild(grid);
  page.appendChild(E("div",{class:"note",style:"margin-top:26px",text:"Script pages are colour-coded on set: when a page is revised, it is reissued on the next stock in the sequence — white, blue, pink, yellow, green, goldenrod, salmon, cherry, buff, tan, then round again. The modules follow the same order, so the colour tells you how far in you are."}));
  paintPager(-1); paintTabs();
  document.title="Screenplay Technician — a technical course in writing for the screen";
}

function paintTabs(){
  const nav=$("#tabs"); nav.innerHTML="";
  const home=E("button",{class:"tab"+(current===-1?"":""),type:"button",style:"--s:#8C93A0",onclick:()=>go(-1)});
  home.setAttribute("aria-current",current===-1?"true":"false");
  home.appendChild(E("span",{class:"swatch"})); home.appendChild(E("span",{class:"num",text:"—"})); home.appendChild(E("span",{text:"Title page"}));
  nav.appendChild(home);
  const groups=[[0,"The page",0,3],[1,"The scene",4,9],[2,"Time and shape",10,15],[3,"Craft under pressure",16,19]];
  groups.forEach(([gi,label,from,to])=>{
    nav.appendChild(E("div",{class:"group",text:label}));
    for(let i=from;i<=to;i++){
      const t=E("button",{class:"tab"+(cleared.has(i)?" done":""),type:"button",style:"--s:"+STOCK[i][1],onclick:()=>go(i)});
      t.setAttribute("aria-current",current===i?"true":"false");
      t.appendChild(E("span",{class:"swatch"}));
      t.appendChild(E("span",{class:"num",text:String(i+1).padStart(2,"0")}));
      t.appendChild(E("span",{text:MODULES[i].title}));
      nav.appendChild(t);
    }
  });
}

function paintPager(i){
  const p=$("#pager"); p.innerHTML="";
  const prev=i>0?i-1:(i===0?-1:null), next=i<MODULES.length-1?i+1:null;
  const btn=(idx,dir)=>{
    const b=E("button",{type:"button",onclick:()=>go(idx)});
    b.appendChild(E("span",{text:dir==="prev"?"Previous":"Next"}));
    b.appendChild(document.createTextNode(idx===-1?"Title page":MODULES[idx].title));
    return b;
  };
  p.appendChild(prev===null?E("button",{disabled:"",type:"button",html:"<span>Previous</span>—"}):btn(prev,"prev"));
  p.appendChild(next===null?E("button",{disabled:"",type:"button",html:"<span>Next</span>—"}):btn(next,"next"));
}

function go(i){
  location.hash=i===-1?"#/":"#/m/"+(i+1);
}
function route(){
  const m=location.hash.match(/#\/m\/(\d+)/);
  $("#binder").classList.remove("open");
  if(m){
    const i=Math.min(MODULES.length,Math.max(1,Number(m[1])))-1;
    renderModule(i);
  } else renderHome();
}
window.addEventListener("hashchange",route);
$("#menuBtn").addEventListener("click",()=>$("#binder").classList.toggle("open"));
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight"&&current<MODULES.length-1)go(current+1);
  if(e.key==="ArrowLeft"&&current>-1)go(current-1);
});
route(); paintProgress();

</script>
